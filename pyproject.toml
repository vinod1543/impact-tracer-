[tool.poetry]
name = "impact-tracer"
version = "0.1.0"
description = "Intelligent Python code change impact analysis"
authors = ["Impact Tracer Core Team"]
packages = [{ include = "impact_tracer" }]

[tool.poetry.scripts]
impact-tracer = "impact_tracer.cli.main:main"
impact-tracer-mcp = "impact_tracer.mcp.server:main"

[tool.poetry.dependencies]
python = "^3.11"
prompt_toolkit = "^3.0"
rich = "^13.7"
pydantic = "^2.6"
pydantic-settings = "^2.2"
networkx = "^3.2"
pyvis = "^0.3.2"
openai = "^1.14"
pyyaml = "^6.0"
httpx = "^0.27"
python-hcl2 = "^4.3"
jsonschema = "^4.21"
pandas = "^2.2"
mcp = { extras = ["cli"], version = "^1.0" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.1"
pytest-cov = "^5.0"
pytest-asyncio = "^0.23"
ruff = "^0.4"
mypy = "^1.9"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
